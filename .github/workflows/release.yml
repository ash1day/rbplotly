name: Release

# Run from the Actions tab on master after bumping Plotly::VERSION. `rake release` builds the
# gem (fetching the checksum-pinned plotly.js), tags vX.Y.Z, pushes the tag and publishes the
# gem through RubyGems trusted publishing.
on:
  workflow_dispatch:

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rake spec
      - uses: rubygems/release-gem@v1
